<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | Табуретка для кокетки</title>
    <!-- Bulma CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <!-- Font Awesome для иконок -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c5530;
            --primary-dark: #1a3a1e;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
        }
        .error-box {
            background: white;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 600px;
            margin: 0 auto;
        }
        .error-number {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .taburetka {
            font-size: 5rem;
            margin: 1rem 0;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .countdown {
            font-size: 1.2rem;
            color: #666;
            margin-top: 2rem;
            padding-top: 1rem;
            border-top: 2px dashed #ddd;
        }
        .has-text-primary-dark {
            color: var(--primary-dark) !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="columns is-centered">
            <div class="column is-8">
                <div class="error-box">
                    <div class="taburetka">🪑</div>
                    <div class="error-number">404</div>
                    <h1 class="title is-2 has-text-primary-dark">Упс! Табуретка не найдена</h1>
                    <p class="subtitle is-5 mb-5">
                        Кажется, эта страница убежала гулять.<br>
                        Но у нас есть много других интересных страниц!
                    </p>
                    
                    <div class="buttons is-centered mt-5">
                        <a href="index.html" class="button is-primary is-large">
                            <span class="icon">
                                <i class="fas fa-home"></i>
                            </span>
                            <span>На главную</span>
                        </a>
                        <a href="faq.html" class="button is-info is-large">
                            <span class="icon">
                                <i class="fas fa-question-circle"></i>
                            </span>
                            <span>FAQ</span>
                        </a>
                        <a href="contacts.html" class="button is-light is-large">
                            <span class="icon">
                                <i class="fas fa-envelope"></i>
                            </span>
                            <span>Контакты</span>
                        </a>
                    </div>

                    <div class="countdown" id="countdown">
                        Вернем вас на главную через <span id="timer">10</span> секунд...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeLeft = 10;
        const timerElement = document.getElementById('timer');
        
        const interval = setInterval(() => {
            timeLeft--;
            timerElement.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(interval);
                window.location.href = 'index.html';
            }
        }, 1000);
    </script>
</body>
</html>
